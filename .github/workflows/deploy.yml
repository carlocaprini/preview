name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}
      SHARE_SIGNING_KEY: ${{ secrets.SHARE_SIGNING_KEY }}
      APP_ORIGIN: https://preview.carlocaprini.com
      CONTENT_ORIGIN: https://content.preview.carlocaprini.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Validate required production configuration
        run: node scripts/validate-deploy-env.mjs
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Cloudflare token
        run: npx cf user tokens verify
      - name: Apply D1 migrations
        run: npx cf d1 migrations apply "$CLOUDFLARE_D1_DATABASE_ID" --dir migrations
      - name: Prepare Worker secrets
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const names = ["OWNER_PASSWORD", "MCP_BEARER_TOKEN", "SHARE_SIGNING_KEY"];
            const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]));
            writeFileSync(`${process.env.RUNNER_TEMP}/preview-worker-secrets.json`, JSON.stringify(secrets), { mode: 0o600 });
          '
      - name: Deploy immutable build
        run: npx cf deploy --message "main@${GITHUB_SHA}" --secrets-file "$RUNNER_TEMP/preview-worker-secrets.json"
      - name: Remove temporary Worker secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/preview-worker-secrets.json"
      - name: Verify production boundaries
        run: node scripts/verify-production.mjs
