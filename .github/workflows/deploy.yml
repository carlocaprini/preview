name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      MCP_ACCESS_CLIENT_ID: ${{ secrets.MCP_ACCESS_CLIENT_ID }}
      SHARE_SIGNING_KEY: ${{ secrets.SHARE_SIGNING_KEY }}
      APP_ORIGIN: https://preview.carlocaprini.com
      CONTENT_ORIGIN: https://content.preview.carlocaprini.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Validate required production configuration
        run: node scripts/validate-deploy-env.mjs
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify Cloudflare token
        run: npx cf user tokens verify
      - name: Apply D1 migrations
        run: npx cf d1 migrations apply "$CLOUDFLARE_D1_DATABASE_ID" --dir migrations
      - name: Deploy immutable build
        run: npx cf deploy --message "main@${GITHUB_SHA}"
      - name: Verify production boundaries
        run: node scripts/verify-production.mjs
